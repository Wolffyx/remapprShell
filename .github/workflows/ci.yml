# Every check `make lint` runs, plus the test suite.
#
# The steps are named one per lint rather than a single `make lint`, so a
# red run says which check failed from the job list alone, without opening
# the log. They must stay in step with the `lint` target in the Makefile:
# a lint that runs locally and not here is one that fails on someone else's
# machine first.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm --needed git jq make diffutils python qt6-declarative xorg-server-xvfb tar kconfig

      - uses: actions/checkout@v4

      # git refuses a repository it does not think belongs to the user running
      # it, which inside the container is every checkout. Without this,
      # lint-slug falls back from `git grep` to `grep -r`, which does not
      # honour .gitignore -- so it reads the generated files and finds the slug
      # in a path built from $HOME. That is what had been failing CI on every
      # push while `make lint` was clean on the machine it was written on.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every generator, not just branding -- the same `brand` target every
      # local `make lint` and `make test` depends on. Generating less here than
      # a developer generates locally is a class of failure on its own: the
      # colour schemes are gitignored, so without gen-colors the theme suite
      # had nothing to install and one assertion failed in CI alone.
      - name: Generate
        run: make brand

      # Fails if the project name is hardcoded outside branding.json.
      - name: Slug lint
        run: ./scripts/lint-slug.sh

      # Fails on imports that violate the dependency ladder.
      - name: Layer lint
        run: ./scripts/lint-layers.sh

      - name: QML lint
        run: ./scripts/lint-qml.sh

      # Fails on widget mistakes qmllint cannot see.
      - name: Widget lint
        run: ./scripts/lint-widgets.sh

      # Fails if a QML test imports a module that needs a running shell --
      # which makes the suite pass here and fail for anyone running it.
      - name: Test import lint
        run: ./scripts/lint-tests.sh

      # Fails if the documented default and the shipped default disagree.
      - name: Defaults lint
        run: ./scripts/lint-defaults.sh

      # Fails if the shell starts an application anywhere but through Launch,
      # where it gets a scope of its own instead of dying with the shell.
      - name: Launch lint
        run: ./scripts/lint-launch.sh

      # Fails if docs/config.md is not what the schema would generate. The
      # reference is committed because people read it on the forge, where
      # nothing runs, so a stale one is trusted and wrong.
      - name: Docs lint
        run: ./scripts/lint-docs.sh

      - name: Tests
        run: xvfb-run -a ./scripts/test.sh

      # Every shell script, the tests' and the previews' too, and the
      # templates in bin/: a template parses as it stands, its @PLACEHOLDERS@
      # being plain words to bash. The templates were in the find and then
      # filtered straight back out of it, so bin/ was never checked at all.
      - name: Shell script syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find scripts bin tests dev/preview -name '*.sh' -o -name '*.sh.in')
          exit $fail
